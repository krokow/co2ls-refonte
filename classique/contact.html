<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Contact — CO2 LASER SERVICES</title>
	<meta name="description" content="CO2 LASER SERVICES — maintenance industrielle spécialisée en photonique.">
	<link rel="icon" type="image/png" href="../assets/img/favicon.png">
	<link rel="stylesheet" href="css/classique.css">
</head>

<body id="page6" data-active="m5" data-page-title="title.contact">
	<div id="main-bg">
		<div id="main">
			<div id="content">
				<div class="line-ver">
					<div class="wrapper-1">

						<div class="col-1">
							<div class="m-block">
								<div class="title">
									<div class="icon"></div>
									<span class="highlight" data-i18n="p5.t1a"></span><span data-i18n="p5.t1b"></span>
								</div>
								<img src="../assets/img/6page-img1.jpg" class="fleft3 m-portrait" width="248" height="125" alt="">
								<div class="contact-ident">
									<p class="company" data-i18n="common.company"></p>
									<p data-i18n="p5.ei"></p>
									<p data-i18n="common.tagline"></p>
									<p data-i18n="p5.addr"></p>
									<p class="phone"><span data-i18n="p5.phone"></span> &rarr;</p>
								</div>
								<div class="clear"></div>
							</div>

							<div class="line-hor"></div>

							<div class="m-block">
								<div class="title">
									<div class="icon"></div>
									<span class="highlight" data-i18n="p5.t2a"></span><span data-i18n="p5.t2b"></span>
								</div>
								<dl class="list-3">
									<h6 data-i18n="p5.pub"></h6>
									<p><span data-i18n="p5.cgv"></span>
										<a href="../assets/CGV.pdf" target="_blank" rel="noopener"
											data-i18n="common.clickHere"></a>
									</p>
									<p><span data-i18n="p5.cgu"></span>
										<a href="mentions-legales.html" data-i18n="common.clickHere"></a>
									</p>
									<p><span data-i18n="p5.host"></span>
										<a href="https://www.levillage.org" target="_blank" rel="noopener">www.levillage.org</a>
									</p>
								</dl>
							</div>
						</div>

						<div class="col-2">
							<div class="m-block">
								<div class="title">
									<div class="icon"></div>
									<span class="highlight" data-i18n="p5.t3a"></span><span data-i18n="p5.t3b"></span>
								</div>

								<form id="contact-form" novalidate>
									<div class="wrapper">
										<label><input id="input-name" type="text" name="name" autocomplete="name"
												data-i18n-placeholder="form.name"></label>
										<label><input id="input-email" type="email" name="email" autocomplete="email"
												data-i18n-placeholder="form.email"></label>
										<textarea id="input-message" name="message" data-i18n-placeholder="form.message"></textarea>
										<div class="clear"></div>

										<div id="form-alert" class="form-alert" role="status" aria-live="polite"></div>

										<div class="buttons-form">
											<button class="button-send-reset" type="reset">
												<svg viewBox="0 0 24 24" aria-hidden="true">
													<path d="M9.3 5.3a1 1 0 0 0 0 1.4l5.3 5.3-5.3 5.3a1 1 0 1 0 1.4 1.4l6-6a1 1 0 0 0 0-1.4l-6-6a1 1 0 0 0-1.4 0Z" />
												</svg><span data-i18n="form.cancel"></span>
											</button>
											<button class="button-send-reset" type="submit">
												<svg viewBox="0 0 24 24" aria-hidden="true">
													<path d="M9.3 5.3a1 1 0 0 0 0 1.4l5.3 5.3-5.3 5.3a1 1 0 1 0 1.4 1.4l6-6a1 1 0 0 0 0-1.4l-6-6a1 1 0 0 0-1.4 0Z" />
												</svg><span data-i18n="form.send"></span>
											</button>
										</div>
									</div>
								</form>
							</div>
						</div>

						<div class="clear"></div>
					</div>
				</div>

				<a href="index.html"><img src="../assets/img/logo.png" id="logo" width="325" height="92"
						alt="CO2 LASER SERVICES"></a>
				<ul id="menu"></ul>
			</div>
			<div id="footer"></div>
		</div>
	</div>

	<script src="../assets/js/content.js"></script>
	<script src="../assets/js/i18n.js"></script>
	<script src="js/classique.js"></script>
</body>

</html>
