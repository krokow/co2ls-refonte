name: Déploiement GitHub Pages

on:
  push:
    branches:
      - main
      - claude/website-redesign-client-4n9fhf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Seule la version « moderne » est publiée : c'est celle que le client a
      # retenue. classique/ reste dans le dépôt comme maquette de référence,
      # mais n'est plus mis en ligne. La racine redirige vers moderne/.
      - name: Préparer le site à publier
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r assets moderne _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
