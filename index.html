<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CO2 LASER SERVICES</title>
	<meta name="robots" content="noindex">
	<!-- Il n'y a plus qu'une version du site : la racine mène directement à
	     moderne/. La redirection est écrite trois fois, du plus fiable au
	     moins fiable, parce qu'aucune des trois ne couvre tous les cas :
	     la balise meta fonctionne sans JavaScript, le script part aussitôt
	     sans laisser d'entrée dans l'historique de navigation (donc le
	     bouton « précédent » ne ramène pas ici en boucle), et le lien
	     visible reste cliquable si les deux premières échouent. -->
	<meta http-equiv="refresh" content="0; url=moderne/">
	<link rel="canonical" href="moderne/">
	<link rel="icon" type="image/png" href="assets/img/favicon.png">
	<style>
		body {
			min-height: 100svh;
			display: flex; align-items: center; justify-content: center;
			margin: 0; padding: 32px;
			background: #04060b;
			color: #7f8a9b;
			font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
			font-size: 15px; line-height: 1.6; text-align: center;
		}

		a { color: #ffcc33; }
	</style>
</head>

<body>
	<p>Redirection vers le site&nbsp;: <a href="moderne/">CO2 LASER SERVICES</a></p>
	<script>location.replace('moderne/');</script>
</body>

</html>
