						</dl>

					<div class="form-panel reveal">
						<form id="contact-form" novalidate>
							<!-- Libellés visibles : pas de placeholder qui ferait doublon. -->
							<div class="field">
								<label for="f-name" data-i18n="form.name"></label>
								<input id="f-name" name="name" type="text" autocomplete="name">
							</div>
							<div class="field">
								<label for="f-mail" data-i18n="form.email"></label>
								<input id="f-mail" name="email" type="email" autocomplete="email">
							</div>
							<div class="field">
								<label for="f-msg" data-i18n="form.messageLabel"></label>
								<textarea id="f-msg" name="message"></textarea>
							</div>

							<div id="alert" class="alert" role="status" aria-live="polite"></div>

							<div class="form-actions">
								<button class="btn btn-primary" type="submit" data-i18n="form.send"></button>
								<button class="btn btn-ghost" type="reset" data-i18n="form.cancel"></button>
							</div>

					</div>
